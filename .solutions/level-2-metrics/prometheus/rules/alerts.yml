groups:
  - name: orders-symptomes
    rules:
      - alert: ErrorRateTooHigh
        expr: |
          100 * sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
            / sum(rate(http_requests_total[5m])) by (service) > 5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreurs 5xx élevé sur {{ $labels.service }}"
          description: "Plus de 5 % de réponses 5xx sur 5 minutes (symptôme perçu par l'utilisateur)."

      - alert: P99LatencyTooHigh
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 0.5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Latence p99 élevée sur {{ $labels.service }}"
          description: "p99 au-dessus de 500 ms sur 5 minutes (symptôme perçu par l'utilisateur)."
